<!DOCTYPE >
<html>
  <head>
    <link rel="stylesheet" href="./css/index.css" />
        <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.10.3/mqtt.min.js"></script>
            <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/x-icon" href="Stew.png">
  </head>
  <body>
    <h1 id="centre">Dosing</h1>
    <div class="parent">
      <div class="child">
        <h1>Motor 1</h1>
        <p id="ml1">Current: mL/min</p>
        <input type="number" placeholder="mL/min" id="motor1MlPerMinute">
      </div>
      <div class="child">
        <h1>Motor 2</h1> 
        <p id="ml2">Current: mL/min</p>
        <input type="number" placeholder="mL/min" id="motor2MlPerMinute">
      </div>
      <div class="child">
        <h1>Motor 3</h1>
        <p id="ml3">Current: mL/min</p>
        <input type="number" placeholder="mL/min" id="motor3MlPerMinute">
      </div>
    </div>

    <p id="centre">Reminder, the dosing triggers every 10min, however you can input in
      mL/min to make calculations easier.
    </p>
        <footer>
      <p id="centre">
        A Website by Anahad Khosa, Design inspired by
        <a href="https://fallout.hackclub.com">Fallout</a>
        (Some elements also taken directly)
      </p>
    </footer>
        <script src="dosing.js" type="text/javascript"></script>
  </body>
</html>
