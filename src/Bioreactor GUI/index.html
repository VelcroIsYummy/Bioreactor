<!doctype html>
<html>
  <head>
    <title>Bioreactor Dashboard</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/x-icon" href="Stew.png">
  </head>
  <body>
    <div class="title">
      <h1 id="center">Bioreactor Dashboard</h1>
    </div>
    <span class="panels">
      <div class="toggles">
        <button>Motor On/Off</button>
        <button>Heater On/Off</button>
        <input type="number" id="tempSelector" placeholder="Temprature SP">
        <input type="number" id="rpmSelector" placeholder="RPM SP">
        <button onclick="location.href = '/dosing.html';">Dosing</button>
      </div>
      <div class="centerInformaticPanel">
        <div class="containerOfDosingAndTempSlashRPM">
          <div class="graph">
            <div id="tempgraph">
              <canvas
                id="tempChart"
                style="position: relative; justify-content: center"
              ></canvas>
            </div>
            <p id="currentTemprature">Current Temprature: 0°C</p>
            <div id="rpmGraph">
              <canvas
                id="rpmChart"
                style="position: relative; justify-content: center"
              ></canvas>
            </div>
            <p id="currentRpmTextLabel">Current RPM: 0RPM</p>
          </div>
          <div class="graph dosingAndSuch">
            <div class="dosingTable">
              <p>Dosing</p>
              <table>
                <tr>
                  <th>Pump Group</th>
                  <th>mL/10min</th>
                </tr>
                <tr>
                  <td>#1</td>
                  <td id="perlGroup1mLPer10Minute">0.0mL/10min</td>
                </tr>
                <tr>
                  <td>#2</td>
                  <td id="perlGroup2mLPer10Minute">0.0mL/10min</td>
                </tr>
              </table>
            </div>
            <div id="od600Graph">
              <canvas
                id="od600Chart"
                style="position: relative; justify-content: center"
              ></canvas>
            </div>
            <p id="currentOD600TextLabel">Current OD600: 0.00Dλ</p>
          </div>
        </div>
      </div>
      <div class="toggles">
        <input type="number" id="motorKpSelector" placeholder="Motor Kp">
        <input type="number" id="motorKiSelector" placeholder="Motor Ki">
        <input type="number" id="motorKdSelector" placeholder="Motor Kd">
        <input type="number" id="heaterKpSelector" placeholder="Heater Kp">
        <input type="number" id="heaterKiSelector" placeholder="Heater Ki">
        <input type="number" id="heaterKdSelector" placeholder="Heater Kd">
      </div>
    </span>
    <footer>
      <p id="centre">
        A Website by Anahad Khosa, Design inspired by
        <a href="https://fallout.hackclub.com">Fallout</a>
        (Some elements also taken directly)
      </p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="./css/index.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.10.3/mqtt.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datasource@0.1.0"></script>
    <script src="index.js" type="text/javascript"></script>
  </body>
</html>
